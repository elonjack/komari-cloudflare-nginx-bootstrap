name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint script
        run: shellcheck --shell=bash komari-cloudflare-nginx.sh

  syntax:
    name: Bash syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: bash -n komari-cloudflare-nginx.sh
